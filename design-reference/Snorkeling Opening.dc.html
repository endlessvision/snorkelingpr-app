<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  @keyframes bobFloat { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-10px) } }
  @keyframes swayFloat { 0%,100%{ transform:translateY(0) rotate(-3deg) } 50%{ transform:translateY(-14px) rotate(3deg) } }
  @keyframes bubbleRise { 0%{ transform:translateY(0) scale(.6); opacity:0 } 15%{ opacity:.8 } 100%{ transform:translateY(-120px) scale(1); opacity:0 } }
  @keyframes shimmer { 0%,100%{ opacity:.35 } 50%{ opacity:.7 } }
  @keyframes splashBubble { 0%{ transform:translateY(0) scale(.5); opacity:0 } 20%{ opacity:.85 } 100%{ transform:translateY(-260px) scale(1); opacity:0 } }
  /* fade in -> hold -> fade out, then stays hidden */
  @keyframes splashSeq {
    0%   { opacity:0; transform:scale(1.06) }
    22%  { opacity:1; transform:scale(1) }
    66%  { opacity:1; transform:scale(1) }
    96%  { opacity:0; transform:scale(.985) }
    100% { opacity:0; transform:scale(.985) }
  }
  @keyframes logoBreathe { 0%{ transform:translateY(6px) } 100%{ transform:translateY(-6px) } }
  @keyframes homeReveal { 0%{ opacity:0; transform:scale(1.015) } 100%{ opacity:1; transform:scale(1) } }
</style>
</helmet>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="o-turtle" viewBox="0 0 100 100"><ellipse cx="50" cy="52" rx="26" ry="22"/><circle cx="50" cy="22" r="9"/><ellipse cx="24" cy="38" rx="10" ry="6" transform="rotate(-35 24 38)"/><ellipse cx="76" cy="38" rx="10" ry="6" transform="rotate(35 76 38)"/><ellipse cx="26" cy="70" rx="9" ry="5" transform="rotate(35 26 70)"/><ellipse cx="74" cy="70" rx="9" ry="5" transform="rotate(-35 74 70)"/></symbol>
    <symbol id="o-fish" viewBox="0 0 100 100"><path d="M20 50 Q45 28 72 50 Q45 72 20 50 Z"/><path d="M72 50 L92 36 L88 50 L92 64 Z"/><circle cx="34" cy="46" r="3" fill="#fff"/></symbol>
    <symbol id="o-star" viewBox="0 0 100 100"><path d="M50 14 L61 40 L89 42 L67 60 L75 88 L50 72 L25 88 L33 60 L11 42 L39 40 Z"/></symbol>
  </defs>
</svg>

<div style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:40px 20px; background:radial-gradient(120% 80% at 50% 0%, #eef7f9, #dceef1); font-family:'Plus Jakarta Sans',sans-serif;">

  <!-- PHONE -->
  <div style="width:380px; height:820px; border-radius:46px; overflow:hidden; position:relative; box-shadow:0 30px 60px -20px rgba(3,40,60,.5); border:7px solid #0a3a4a; background:linear-gradient(180deg,#bdf1f6 0%,#5fd9e6 14%,#16c0d8 36%,#0a8fb6 58%,#0a5c84 78%,#073a5c 100%);">

    <!-- ===== HOME SCREEN (revealed) ===== -->
    <div style="position:absolute; inset:0; animation:homeReveal .6s cubic-bezier(.22,1,.36,1) 2.25s both;">
      <div style="position:absolute; inset:0; background:radial-gradient(90% 40% at 30% -8%, rgba(255,255,255,.6), transparent 60%);"></div>
      <div style="position:absolute; top:0; left:20%; width:60px; height:340px; background:linear-gradient(rgba(255,255,255,.45),transparent); transform:skewX(-12deg); filter:blur(6px); animation:shimmer 6s ease-in-out infinite;"></div>
      <div style="position:absolute; top:0; left:55%; width:40px; height:280px; background:linear-gradient(rgba(255,255,255,.4),transparent); transform:skewX(10deg); filter:blur(6px); animation:shimmer 7s ease-in-out infinite .6s;"></div>
      <div style="position:absolute; left:60px; bottom:120px; width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,.6); animation:bubbleRise 5s ease-in infinite;"></div>
      <div style="position:absolute; left:120px; bottom:90px; width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.5); animation:bubbleRise 6s ease-in infinite 1.5s;"></div>
      <div style="position:absolute; right:80px; bottom:140px; width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.55); animation:bubbleRise 5.5s ease-in infinite .8s;"></div>

      <div style="position:relative; height:46px; display:flex; align-items:center; justify-content:space-between; padding:0 26px; color:#fff; font:800 14px 'Nunito';"><span>9:41</span><span style="font-size:11px; letter-spacing:1px;">●●● ⌃ ▮</span></div>

      <div style="position:relative; padding:6px 24px 0;">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <div>
            <div style="font:500 14px 'Plus Jakarta Sans'; color:rgba(255,255,255,.9);">Good morning,</div>
            <div style="font:600 30px 'Fredoka'; color:#fff; line-height:1.05;">Maya 🌊</div>
          </div>
          <div style="width:46px; height:46px; border-radius:50%; background:#ff2e93; display:flex; align-items:center; justify-content:center; color:#fff; font:700 18px 'Nunito'; box-shadow:0 6px 16px rgba(255,46,147,.5);">M</div>
        </div>
        <div style="display:inline-flex; align-items:center; gap:7px; margin-top:12px; background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.4); padding:7px 13px; border-radius:100px; color:#fff; font:700 12.5px 'Nunito'; backdrop-filter:blur(4px);">📍 Floating above Icacos Reef · 12 ft</div>
      </div>

      <svg style="position:absolute; left:40px; top:330px; width:96px; height:96px; color:rgba(255,255,255,.85); animation:swayFloat 8s ease-in-out infinite;"><use href="#o-turtle"/></svg>
      <svg style="position:absolute; right:46px; top:420px; width:54px; height:54px; color:rgba(255,210,63,.95); animation:bobFloat 5s ease-in-out infinite;"><use href="#o-fish"/></svg>
      <svg style="position:absolute; left:150px; top:500px; width:40px; height:40px; color:rgba(255,46,147,.85); animation:bobFloat 6s ease-in-out infinite 1s;"><use href="#o-fish"/></svg>

      <div style="position:absolute; left:18px; right:18px; bottom:104px;">
        <div style="text-align:center; color:rgba(255,255,255,.9); font:700 11px 'Nunito'; letter-spacing:.08em; margin-bottom:10px;">↓ KEEP SCROLLING TO DIVE DEEPER</div>
        <div style="background:rgba(255,255,255,.96); border-radius:22px; padding:16px 18px; box-shadow:0 16px 30px -12px rgba(3,40,60,.5);">
          <div style="display:flex; align-items:center; justify-content:space-between;">
            <div style="font:700 11px 'Nunito'; color:#ff2e93; letter-spacing:.05em;">YOUR NEXT DIVE · IN 2 DAYS</div>
            <div style="font:800 11px 'Nunito'; color:#0a8fb6;">9:00 AM</div>
          </div>
          <div style="font:600 21px 'Fredoka'; color:#0a4f70; margin:5px 0 3px;">Icacos Snorkel &amp; Slide</div>
          <div style="display:flex; align-items:center; gap:8px;">
            <div style="display:flex;">
              <span style="width:26px; height:26px; border-radius:50%; background:#16c0d8; border:2px solid #fff;"></span>
              <span style="width:26px; height:26px; border-radius:50%; background:#ff2e93; border:2px solid #fff; margin-left:-9px;"></span>
              <span style="width:26px; height:26px; border-radius:50%; background:#ffd23f; border:2px solid #fff; margin-left:-9px;"></span>
            </div>
            <span style="font:600 12px 'Plus Jakarta Sans'; color:#789;">Captain Dante + 3 crew</span>
          </div>
        </div>
      </div>

      <div style="position:absolute; left:16px; right:16px; bottom:18px; height:66px; background:rgba(255,255,255,.97); border-radius:24px; box-shadow:0 12px 30px -8px rgba(3,40,60,.45); display:flex; align-items:center; justify-content:space-around; padding:0 6px;">
        <div style="display:flex; flex-direction:column; align-items:center; gap:3px; color:#16c0d8;"><svg style="width:24px;height:24px"><use href="#o-turtle"/></svg><span style="font:800 9px 'Nunito'">Dive</span></div>
        <div style="display:flex; flex-direction:column; align-items:center; gap:3px; color:#b9c8cf;"><svg style="width:22px;height:22px"><use href="#o-star"/></svg><span style="font:800 9px 'Nunito'">Collect</span></div>
        <div style="width:52px; height:52px; border-radius:50%; background:linear-gradient(#ff5bb0,#ff2e93); margin-top:-22px; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 18px rgba(255,46,147,.5); color:#fff; font:700 22px 'Fredoka';">+</div>
        <div style="display:flex; flex-direction:column; align-items:center; gap:3px; color:#b9c8cf;"><span style="font-size:18px">🛂</span><span style="font:800 9px 'Nunito'">Passport</span></div>
        <div style="display:flex; flex-direction:column; align-items:center; gap:3px; color:#b9c8cf;"><span style="font-size:18px">🛍️</span><span style="font:800 9px 'Nunito'">Shop</span></div>
      </div>
    </div>

    <!-- ===== SPLASH OVERLAY ===== -->
    <sc-if value="{{ showSplash }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; overflow:hidden; background:{{ splashBg }}; animation:splashSeq 2.8s cubic-bezier(.4,0,.2,1) forwards;">
        <sc-if value="{{ bubblesOn }}" hint-placeholder-val="{{ true }}">
          <div style="position:absolute; inset:0; pointer-events:none;">
            <div style="position:absolute; left:24%; bottom:80px; width:12px; height:12px; border-radius:50%; background:rgba(255,255,255,.5); animation:splashBubble 4.5s ease-in infinite;"></div>
            <div style="position:absolute; left:62%; bottom:60px; width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.45); animation:splashBubble 5.2s ease-in infinite .8s;"></div>
            <div style="position:absolute; left:46%; bottom:100px; width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.4); animation:splashBubble 4s ease-in infinite 1.6s;"></div>
            <div style="position:absolute; left:78%; bottom:120px; width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.4); animation:splashBubble 5.6s ease-in infinite .4s;"></div>
          </div>
        </sc-if>
        <img src="assets/snorkeling-logo.jpeg" alt="Snorkeling Puerto Rico" style="width:82%; max-width:300px; height:auto; border-radius:24px; animation:logoBreathe 2.8s ease-in-out infinite alternate;">
      </div>
    </sc-if>

  </div>

  <!-- REPLAY -->
  <button onClick="{{ replay }}" style="display:inline-flex; align-items:center; gap:8px; border:none; cursor:pointer; background:#0a4f70; color:#fff; font:700 13px 'Nunito'; padding:11px 20px; border-radius:100px; box-shadow:0 8px 20px -8px rgba(10,79,112,.6);" style-hover="background:#0a3a5c;">↻ Replay opening</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:920},&quot;splashBg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#870486&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#870486&quot;,&quot;#5b0a6e&quot;,&quot;#0a4f70&quot;,&quot;#16c0d8&quot;],&quot;section&quot;:&quot;Splash&quot;},&quot;bubblesOn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Splash&quot;}}">
class Component extends DCLogic {
  state = { showSplash: true };

  componentDidMount() {
    this._hideAfter();
  }

  componentWillUnmount() {
    clearTimeout(this._t);
  }

  _hideAfter() {
    clearTimeout(this._t);
    // matches the 2.8s splashSeq animation
    this._t = setTimeout(() => this.setState({ showSplash: false }), 2850);
  }

  replay() {
    // remove then re-mount the splash so the CSS animation restarts from 0
    this.setState({ showSplash: false }, () => {
      requestAnimationFrame(() => {
        this.setState({ showSplash: true }, () => this._hideAfter());
      });
    });
  }

  renderVals() {
    return {
      showSplash: this.state.showSplash,
      splashBg: this.props.splashBg ?? '#870486',
      bubblesOn: this.props.bubblesOn ?? true,
      replay: () => this.replay(),
    };
  }
}
</script>
</body>
</html>
